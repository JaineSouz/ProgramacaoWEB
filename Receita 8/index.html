<!DOCTYPE html>

<html>

<head>
    <meta charset="UTF-8">
    <title>Receita 8</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }

        button {
            padding: 10px 20px;
            margin-bottom: 20px;
            cursor: pointer;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            background-color: white;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #333;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: #ddd;
        }
    </style>
</head>

<body>

    <button id="botaoCarregar">
        Carregar posts
    </button>

    <div id="usuariosDiv"></div>

    <script type="module">
        import { montarTabela } from "./tabela.js"


        function carregarPosts() {

            fetch("https://jsonplaceholder.typicode.com/posts")
                .then(res => {
                    return res.json()
                })
                .then(posts => {

                    let tabela = montarTabela(posts)

                    document.getElementById("usuariosDiv").innerHTML = tabela

                })
                .catch(err => {

                    document.getElementById("usuariosDiv").innerHTML =
                        `Erro ao carregar os posts: ${err}`

                })

        }

        let botao = document.getElementById("botaoCarregar")

        botao.addEventListener("click", () => carregarPosts())


    </script>

</body>

</html>
